<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Sayang 💜</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="bg"></div>

<div class="wrap">

<div class="card">

<h1>Happy Birthday, Sayang 💜</h1>

<img class="hero" src="400130.png" alt="Capybara">

<p>18 Oktober 2026</p>

<p class="made">
    Made with 🤍 by your boyfriend
</p>

<button onclick="start()">
    🎁 Mulai
</button>

  </div> <!-- Penutup .card dipindah ke sini -->

<div id="letter">

<h2>Hai sayangku 🥰</h2>

<p id="typing"></p>

</div>

  <div id="ending">

    <h2>🤍 I Love You 🤍</h2>

    <button id="capyButton" onclick="showGift()">
    <img id="capyHead" src="capy-btn.png" class="capy-btn" alt="Capybara">
    </button>

</div>

<div id="giftMessage">

    <img src="capy-talk.png" class="capy-talk" alt="Capybara">

    <div class="bubble">
        <b>🐹 Hehe... sekarang waktunya! 🤍</b>

        <br><br>

        Sekarang boleh buka hadiah yg udah disiapin pacar kamu yaa.

        <br><br>

        Semoga kamu suka yaa! 🥰🎁
    </div>

</div>

</div>

<audio id="bgm" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<audio id="popSound" preload="auto">
    <source src="pop.mp3" type="audio/mpeg">
</audio>
    
<script src="script.js"></script>
</body>
</html>
